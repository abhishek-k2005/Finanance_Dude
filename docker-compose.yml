version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finagent-backend
    env_file:
      - .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - finagent-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finagent-frontend
    env_file:
      - .env
    environment:
      FASTAPI_BASE_URL: http://backend:8000
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - backend
    ports:
      - "8501:8501"
    networks:
      - finagent-network
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501

networks:
  finagent-network:
    driver: bridge
